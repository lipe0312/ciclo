# #164 Deploy pelo GitHub Actions (N8: a produção só sai daqui, com a aprovação do dono).
#   staging    → automático no push na main, depois do CI verde (o mesmo ci.yml, via workflow_call).
#   production → só por workflow_dispatch (Actions → deploy → Run workflow), no environment `production`, cujo required reviewer
#                é o dono (configurado na #167). Anota o ponto de restauração do D1 antes de mexer em qualquer coisa.
# Segredos SÓ do environment (staging ou production), nunca do repositório, e só via `env:` (mascarados) NO PASSO que usa o wrangler:
# `npm ci` e o build nunca enxergam o token. Sem `set -x`.
# O database_id real vem do secret D1_DATABASE_ID do environment (secret, não variable: o GitHub imprime o env: do passo no log): o predeploy grava apps/worker/wrangler.deploy.jsonc no runner
# (fora do git) e o wrangler roda com --config. O repositório público continua com o placeholder 00000000-….
# APP_VERSION = commit (--var APP_VERSION:<sha>); o smoke confere que o /api/health devolve esse commit.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag ou branch que vai para a produção"
        required: true
        default: main
permissions: {}
env:
  WRANGLER_SEND_METRICS: "false"
  CONFIG: apps/worker/wrangler.deploy.jsonc
jobs:
  ci:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  staging:
    needs: ci
    if: github.event_name == 'push' && github.repository == 'lipe0312/ciclo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Environment staging configurado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          falta=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || falta="$falta CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || falta="$falta CLOUDFLARE_ACCOUNT_ID"
          [ -n "$D1_DATABASE_ID" ] || falta="$falta D1_DATABASE_ID"
          if [ -n "$falta" ]; then echo "::error::environment staging sem$falta: veja a issue H-02 (#167)"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Config do deploy (database_id do environment, fora do git)
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node scripts/predeploy.mjs --gerar-config staging
      - run: node scripts/predeploy.mjs --staging --with-build --config "$CONFIG"
      - name: Migrations no D1 de staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ciclo-db-staging --remote --env staging --config "$CONFIG"
      - name: Deploy (APP_VERSION = commit)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging --config "$CONFIG" --var "APP_VERSION:$GITHUB_SHA"
      - name: Smoke
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          URL="$(node scripts/predeploy.mjs --url staging)"
          node scripts/smoke.mjs "$URL" --sha "$GITHUB_SHA" --ambiente staging
      - name: Apaga a config do deploy
        if: always()
        run: rm -f "$CONFIG"

  production:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'lipe0312/ciclo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Environment production configurado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          falta=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || falta="$falta CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || falta="$falta CLOUDFLARE_ACCOUNT_ID"
          [ -n "$D1_DATABASE_ID" ] || falta="$falta D1_DATABASE_ID"
          if [ -n "$falta" ]; then echo "::error::environment production sem$falta: veja a issue H-02 (#167)"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: O ref já está na main (nada sobe sem ter passado pelo PR e pelo staging)
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::o ref pedido não está na main: produção só sobe commit que já passou pelo PR e pelo staging"
            exit 1
          fi
      - name: Commit que vai subir
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "### Produção: commit \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - name: Config do deploy (database_id do environment, fora do git)
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node scripts/predeploy.mjs --gerar-config production
      - name: Predeploy (config, migrations e secrets da produção)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/predeploy.mjs --with-build --config "$CONFIG"
      - name: Ponto de restauração do D1 (antes das migrations)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 time-travel info ciclo-db --json --config "$CONFIG" > "$RUNNER_TEMP/tt.json"
          BOOKMARK="$(node -e 'const t=require("fs").readFileSync(process.argv[1],"utf8");const b=JSON.parse(t.slice(t.indexOf("{"))).bookmark;if(!/^[0-9a-f-]{10,}$/.test(b||""))process.exit(1);process.stdout.write(b)' "$RUNNER_TEMP/tt.json")" \
            || { echo "::error::não consegui o bookmark do D1: sem ponto de restauração, nada sobe"; exit 1; }
          rm -f "$RUNNER_TEMP/tt.json"
          {
            echo "**Ponto de restauração do D1** (antes das migrations): \`$BOOKMARK\`"
            echo ""
            echo "Para voltar os dados: \`npx wrangler d1 time-travel restore ciclo-db --bookmark=$BOOKMARK\` (até 7 dias, plano grátis)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "bookmark do D1 anotado no resumo do job"
      - name: Migrations no D1 de produção
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ciclo-db --remote --config "$CONFIG"
      - name: Deploy (APP_VERSION = commit)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config "$CONFIG" --var "APP_VERSION:$SHA"
      - name: Smoke e commit no ar
        run: |
          URL="$(node scripts/predeploy.mjs --url production)"
          node scripts/smoke.mjs "$URL" --sha "$SHA" --ambiente producao
      - name: Apaga a config do deploy
        if: always()
        run: rm -f "$CONFIG"
